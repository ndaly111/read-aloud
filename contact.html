<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact | Read-Aloud</title>
<link rel="canonical" href="https://read-aloud.com/contact.html">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Contact the Read-Aloud team for support or feedback.">
  <link rel="stylesheet" href="/styles.css">
  <script src="/cookie-consent.js" defer></script>
</head>

<body>
<header class="site-header">
  <div class="nav-container">
    <a class="logo" href="/index.html">Read‑Aloud</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/index.html">Home</a>
      <a href="/guides.html">Guides</a>
      <a href="/help.html">Help</a>
      <a href="/recommendations.html">Resources</a>
    </nav>
  </div>
</header>

<main>
  <header class="page-head">
    <p class="eyebrow"><span>Read‑Aloud</span><span class="sep">·</span><span>Contact</span></p>
    <h1>Send <em>a note.</em></h1>
    <p class="lead">
      Feedback, feature requests, or bug reports — all welcome. Use the form below or email <a href="mailto:admin@read-aloud.com">admin@read-aloud.com</a>. Replies usually within a few days.
    </p>
  </header>

  <article class="content">
    <form id="contact-form" novalidate>
      <label for="name">Name</label>
      <input required id="name" name="name" type="text">

      <label for="email">Email</label>
      <input required id="email" name="_replyto" type="email">

      <label for="msg">Message</label>
      <textarea required id="msg" name="message" rows="6"></textarea>

      <input type="hidden" name="_subject" value="Contact form: read-aloud.com">
      <input type="hidden" name="_page" value="/contact.html">
      <!-- honeypot: humans don't fill this; bots do. The worker drops the submission. -->
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
      <!-- Cloudflare Turnstile (anti-bot). Sitekey must match the widget for read-aloud.com. -->
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAE2HHCDel9zufmUg" data-theme="light" data-size="flexible"></div>

      <button type="submit">Send message</button>
      <p class="feedback-status" role="status" aria-live="polite"></p>
    </form>
  </article>
</main>

<footer class="site-footer">
  <div class="footer-container">
    <span>© 2026 Read‑Aloud</span> · <a href="/about.html">About</a> · <a href="/contact.html">Contact</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a>
  </div>
</footer>

<!-- contact form submit (Cloudflare Worker -> email; Turnstile-verified) -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
(() => {
  const form = document.getElementById('contact-form');
  if (!form) return;
  const status = form.querySelector('.feedback-status');
  const submit = form.querySelector('button[type="submit"]');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.checkValidity()) {
      status.textContent = 'Please fill in name, email, and message.';
      status.className = 'feedback-status feedback-error';
      return;
    }
    submit.disabled = true;
    submit.textContent = 'Sending…';
    status.textContent = '';
    status.className = 'feedback-status';
    try {
      const resp = await fetch('https://read-aloud-feedback.ndaly111.workers.dev', {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) throw new Error(data.error || ('Worker returned ' + resp.status));
      status.textContent = 'Thanks — got it. We usually reply within a few days.';
      status.className = 'feedback-status feedback-ok';
      form.reset();
      submit.textContent = 'Sent';
    } catch (err) {
      console.warn('contact submit failed', err);
      status.textContent = (err && err.message && !/^Worker returned/.test(err.message))
        ? err.message : "Couldn't send. Email admin@read-aloud.com.";
      status.className = 'feedback-status feedback-error';
      submit.disabled = false;
      submit.textContent = 'Try again';
    } finally {
      if (window.turnstile) { try { window.turnstile.reset(); } catch (_) {} }
    }
  });
})();
</script>
</body>
</html>
