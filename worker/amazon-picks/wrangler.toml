name = "read-aloud-amazon-picks"
main = "src/index.js"
compatibility_date = "2026-10-07"
account_id = "d36f6a50c928a16dc27e0e789a94617f"

# Homepage "Worth a look" Amazon picks strip. Secrets (set with `wrangler secret put`):
#   CREATORS_ID / CREATORS_SECRET - Amazon Creators API credential (Associates Central > Tools).
# Kill switch: PICKS_ENABLED = "false" and redeploy; the strip stays hidden on every page.
[vars]
PICKS_ENABLED = "true"
# Site-level tracking ID Nick created 11/02 so read-aloud earnings show separately in Associates
# Central reports. The account store ID is nickdaly0c-20 (the 2020 "nickdaly-20" was closed).
PARTNER_TAG = "read-aloud-20"
# Per-pick tracking IDs Nick has CREATED in Associates Central (space-separated). A pick whose
# derived ID (see trackingTag in src/catalog.js) is listed here links with it; the rest use
# PARTNER_TAG. Never list an ID that does not exist yet - such links earn nothing.
TRACKING_TAGS = "raaudible-20 raairtag-20 rapocketprinter-20 rabirdfeedercam-20 rasunriseclock-20 ranecklight-20 raspinscrubber-20 raminiprojector-20 rahandwarmer-20 rawirelessheadph-20 raprimetrial-20 ramusicunlimited-20"

# 17 */6: product facts refresh (title/photo/price; Amazon requires shown prices < 24h old).
# 7 6 * * 1: weekly pool rotation (Monday 06:07 UTC) - bench unclicked picks, promote bench.
[triggers]
crons = ["17 */6 * * *", "7 6 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "read-aloud-picks"
database_id = "22f04308-0aa9-4488-9f62-b7a7bba62b6c"
