name = "read-aloud-donation-goal"
main = "src/index.js"
compatibility_date = "2026-10-07"

# Intentionally disabled until opening ledger,
# webhook secret and D1 are configured AND reconciled.
[vars]
GOAL_B_USD = "50"
GOAL_C_USD = "100"
GOAL_DATA_VERIFIED = "false"
GOAL_VERIFIED_MONTH = ""
EXPERIMENT_ENABLED = "false"
EXPERIMENT_LAUNCH_UTC = ""
ATTRIBUTION_VERIFIED = "false"

# After "npx wrangler d1 create read-aloud-donations", add the returned database ID:
# [[d1_databases]]
# binding = "DB"
# database_name = "read-aloud-donations"
# database_id = "<real database ID>"
